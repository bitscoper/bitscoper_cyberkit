# By Abdullah As-Sadeed

name: bitscoper_cyberkit
description: A Flutter application offering Bluetooth Low Energy Scanner, IPv4 Subnet Scanner, mDNS Scanner, UPnP Scanner, Route Tracer, TCP Port Scanner, Pinger, DNS Record Retriever, File Hash Calculator, String Hash Calculator, Base Encoder, Series URI Crawler, OGP Data Extractor, WHOIS Retriever, CVSS Calculator, Morse Code Translator, and Wi-Fi Details Viewer.
version: 2026.10.8+20261008
publish_to: none

environment:
  sdk: ">=3.13.3"
  flutter: ">=3.47.4"

dependencies:
  b: ^0.2.0
  connectivity_plus: ^7.3.1
  crypto: ^3.0.7
  cupertino_ui: ^1.1.2
  cvss_vulnerability_scoring: ^1.0.0
  dart_ping: ^10.0.1 # !Web
  dns_client: ^1.3.1 # !Web
  file_picker: ^13.1.0
  flex_color_scheme: ^9.0.0
  flutter:
    sdk: flutter
  flutter_blue_plus: ^2.3.14
  flutter_local_notifications: ^22.3.1 # !Web
  flutter_localizations:
    sdk: flutter
  flutter_native_splash: ^2.4.8 # !Linux !maxOS !Windows
  flutter_riverpod: ^3.4.3
  flutter_staggered_grid_view: ^0.7.0
  flutter_traceroute:
    git:
      url: https://github.com/bitscoper/flutter_traceroute.git # !Linux !macOS !Windows !Web
  html: ^0.15.7
  http: ^1.6.0
  intl: ^0.20.3
  material_ui: ^1.6.0
  morse_code_translator: ^0.0.1
  multicast_dns: ^0.3.3+1 # !Web
  network_info_plus: ^8.2.1
  ogp_data_extract: ^0.2.2
  package_info_plus: ^10.2.2
  permission_guard: ^2.0.1 # !Linux # !macOS
  quick_actions: ^1.1.1 # !Linux !macOS !Windows !Web
  shared_preferences: ^2.5.6
  tcp_scanner: ^2.0.5 # !Web
  tdtx_nf_icons: ^3.2.2+5
  timelines_plus: ^2.0.1
  upnp_client: ^1.5.0 # !Web
  url_launcher: ^6.3.3
  uuid: ^4.6.0
  whois: ^1.0.0 # !Web
  yaml: ^3.1.4

dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  msix: ^3.18.0
  rename: ^3.1.0

flutter:
  assets:
    - assets/icon/square_transparent_unpadded_colored_256x256.ico
    - assets/icon/square_transparent_unpadded_colored_512x512.png
    - assets/icon/square_transparent_unpadded_greyscale_512x512.png
    - assets/icon/square_transparent_unpadded_monochrome_512x512.png
    - assets/icon/square_whiteBackground_25percentPadding_colored_48x48.png
    - assets/icon/square_whiteBackground_25percentPadding_colored_72x72.png
    - assets/icon/square_whiteBackground_25percentPadding_colored_96x96.png
    - assets/icon/square_whiteBackground_25percentPadding_colored_128x128.png
    - assets/icon/square_whiteBackground_25percentPadding_colored_192x192.png
    - assets/icon/square_whiteBackground_25percentPadding_colored_256x256.png
    - assets/icon/square_whiteBackground_25percentPadding_colored_384x384.png
    - assets/icon/square_whiteBackground_25percentPadding_colored_512x512.png
    - assets/icon/square_whiteBackground_50percentPadding_colored_1152x1152.png

  generate: true
  uses-material-design: true

flutter_launcher_icons:
  image_path: assets/icon/square_whiteBackground_25percentPadding_colored_512x512.png

  android: true
  min_sdk_android: 24
  image_path_android: assets/icon/square_whiteBackground_25percentPadding_colored_512x512.png
  adaptive_icon_background: "#FEF7FF"
  adaptive_icon_foreground_inset: 25
  adaptive_icon_foreground: assets/icon/square_transparent_unpadded_colored_512x512.png
  adaptive_icon_monochrome: assets/icon/square_transparent_unpadded_monochrome_512x512.png

  macos:
    generate: true
    image_path: assets/icon/square_whiteBackground_25percentPadding_colored_512x512.png

  ios: true
  remove_alpha_ios: true
  background_color_ios: "#FEF7FF"
  image_path_ios: assets/icon/square_transparent_unpadded_colored_512x512.png
  image_path_ios_dark_transparent: assets/icon/square_transparent_unpadded_colored_512x512.png
  image_path_ios_tinted_grayscale: assets/icon/square_transparent_unpadded_greyscale_512x512.png
  desaturate_tinted_to_grayscale_ios: true

  windows:
    generate: true
    image_path: assets/icon/square_whiteBackground_25percentPadding_colored_256x256.png
    icon_size: 256

  web:
    generate: true
    image_path: assets/icon/square_whiteBackground_25percentPadding_colored_512x512.png
    background_color: "#FEF7FF"
    theme_color: "#FEF7FF"

flutter_native_splash:
  fullscreen: true
  color: "#FEF7FF"
  image: assets/icon/square_transparent_unpadded_colored_512x512.png
  color_dark: "#322F35"
  image_dark: assets/icon/square_transparent_unpadded_colored_512x512.png

  android: true
  android_min_sdk: 24
  android_screen_orientation: user
  android_gravity: center

  color_android: "#FEF7FF"
  image_android: assets/icon/square_transparent_unpadded_colored_512x512.png
  color_dark_android: "#322F35"
  image_dark_android: assets/icon/square_transparent_unpadded_colored_512x512.png

  android_12:
    color: "#FEF7FF"
    icon_background_color: "#FEF7FF"
    image: assets/icon/square_whiteBackground_50percentPadding_colored_1152x1152.png

    color_dark: "#322F35"
    icon_background_color_dark: "#FEF7FF"
    image_dark: assets/icon/square_whiteBackground_50percentPadding_colored_1152x1152.png

  ios: true
  ios_content_mode: center

  color_ios: "#FEF7FF"
  image_ios: assets/icon/square_transparent_unpadded_colored_512x512.png
  color_dark_ios: "#322F35"
  image_dark_ios: assets/icon/square_transparent_unpadded_colored_512x512.png

  web: true
  web_image_mode: center

  color_web: "#FEF7FF"
  image_web: assets/icon/square_transparent_unpadded_colored_512x512.png
  color_dark_web: "#322F35"
  image_dark_web: assets/icon/square_transparent_unpadded_colored_512x512.png

msix_config:
